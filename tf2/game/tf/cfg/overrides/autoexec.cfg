// Personal settings, loaded by mastercomfig after its own config
fov_desired 90
viewmodel_fov 90
tf_use_min_viewmodels 1
glow_outline_effect_enable 1

// Hitsounds
tf_dingalingaling 1                 // hitsound on
tf_dingalingaling_effect 0          // 0 Default, 1 Electro, 2 Notes, 3 Percussion, 4 Retro, 5 Space, 6 Beepo, 7 Vortex, 8 Squasher
tf_dingaling_volume 0.85
tf_dingaling_pitchmindmg 130        // chip damage = high pitch
tf_dingaling_pitchmaxdmg 60         // big hits = low pitch
tf_dingalingaling_repeat_delay 0    // play a sound for every hit

// Killsound
tf_dingalingaling_lasthit 1
tf_dingalingaling_last_effect 0     // same list as above
tf_dingaling_lasthit_volume 1       // a bit louder than hits so kills stand out
tf_dingaling_lasthit_pitchmindmg 100
tf_dingaling_lasthit_pitchmaxdmg 100 // fixed pitch so a kill always sounds the same

// Damage numbers
hud_combattext 1
hud_combattext_batching 1           // merge back-to-back hits on the same target into one number
hud_combattext_doesnt_block_overhead_text 1

// Batching window = longest gap between two hits on one target that still merge (0.1-2.0).
// Each class picks one in overrides/<class>.cfg - mastercomfig runs that file on class switch.
alias dmgbatch_shots  "hud_combattext_batching_window 0.2"  // every shot stays its own number (fastest deliberate refire ~0.31s) - pistol spam and same-tick splash merge
alias dmgbatch_stream "hud_combattext_batching_window 0.45" // minigun/syringe/sentry total survives up to 3 missed shots - under Family Business 0.53s and shotguns 0.625s
alias dmgbatch_dot    "hud_combattext_batching_window 0.6"  // also folds 0.5s afterburn/bleed ticks into the running total
dmgbatch_shots                      // default until a class is picked

// Demos - backup in case Steam recording drops out (saved to tf/demos)
ds_enable 2                         // 0 Manual, 1 Competitive only, 2 All matches, 3 Tournament only
ds_screens 0                        // no scoreboard screenshot at match end

// Hide the primary viewmodel only (slot tracking for keys, wheel, Q, banner)
exec overrides/hide_primary.cfg

// Class mouse binds - each class cfg resets these first, so spy/engi binds never carry over
alias classbinds_default "unbind MOUSE4; bind MOUSE5 +voicerecord"
classbinds_default                  // also on launch, in case the game was closed as spy/engi
