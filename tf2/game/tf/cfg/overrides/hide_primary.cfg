// Hide the viewmodel only while the primary (slot 1) is out.
// TF2 can't tell a script which weapon is held, so this tracks the slot itself:
// number keys, mouse wheel and Q all switch through vmh_go<N>, which knows the slot it lands on.
// Exec'd from overrides/autoexec.cfg. Each overrides/<class>.cfg sets the wheel cycle and calls vmh_spawn.
// No semicolons in comments: TF2 splits on them even after //.

alias vmh_nop ""

// What to remember as "last weapon" when leaving a slot (for Q)
alias vmh_remember1 "alias vmh_lastgo vmh_go1"
alias vmh_remember2 "alias vmh_lastgo vmh_go2"
alias vmh_remember3 "alias vmh_lastgo vmh_go3"
alias vmh_remember4 "alias vmh_lastgo vmh_go4"
alias vmh_remember5 "alias vmh_lastgo vmh_go5"

// Per-slot state: vmh_r<N> = what to remember when switching to slot N from here (nothing if already there)
alias vmh_state1 "alias vmh_r1 vmh_nop; alias vmh_r2 vmh_remember1; alias vmh_r3 vmh_remember1; alias vmh_r4 vmh_remember1; alias vmh_r5 vmh_remember1; alias vmh_next vmh_after1; alias vmh_prev vmh_before1; alias vmh_atk vmh_nop"
alias vmh_state2 "alias vmh_r1 vmh_remember2; alias vmh_r2 vmh_nop; alias vmh_r3 vmh_remember2; alias vmh_r4 vmh_remember2; alias vmh_r5 vmh_remember2; alias vmh_next vmh_after2; alias vmh_prev vmh_before2; alias vmh_atk vmh_nop"
alias vmh_state3 "alias vmh_r1 vmh_remember3; alias vmh_r2 vmh_remember3; alias vmh_r3 vmh_nop; alias vmh_r4 vmh_remember3; alias vmh_r5 vmh_remember3; alias vmh_next vmh_after3; alias vmh_prev vmh_before3; alias vmh_atk vmh_nop"
alias vmh_state4 "alias vmh_r1 vmh_remember4; alias vmh_r2 vmh_remember4; alias vmh_r3 vmh_remember4; alias vmh_r4 vmh_nop; alias vmh_r5 vmh_remember4; alias vmh_next vmh_after4; alias vmh_prev vmh_before4; alias vmh_atk vmh_nop"
alias vmh_state5 "alias vmh_r1 vmh_remember5; alias vmh_r2 vmh_remember5; alias vmh_r3 vmh_remember5; alias vmh_r4 vmh_remember5; alias vmh_r5 vmh_nop; alias vmh_next vmh_after5; alias vmh_prev vmh_before5; alias vmh_atk vmh_nop"

// Switch to slot N. vmh_on2 is the class hook for the secondary (soldier: banner).
alias vmh_go1 "vmh_r1; slot1; r_drawviewmodel 0; vmh_state1"
alias vmh_go2 "vmh_r2; slot2; r_drawviewmodel 1; vmh_state2; vmh_on2"
alias vmh_go3 "vmh_r3; slot3; r_drawviewmodel 1; vmh_state3"
alias vmh_go4 "vmh_r4; slot4; r_drawviewmodel 1; vmh_state4"
alias vmh_go5 "vmh_r5; slot5; r_drawviewmodel 1; vmh_state5"

// Mouse wheel order. Fixed steps, class files override the wrap-around for 4/5-slot classes.
alias vmh_after1 vmh_go2
alias vmh_after2 vmh_go3
alias vmh_before2 vmh_go1
alias vmh_before3 vmh_go2
// Keys 4/5 only join the tracking on classes that have those slots (spy disguise kit, engineer PDAs).
alias vmh_cycle3 "alias vmh_after3 vmh_go1; alias vmh_before1 vmh_go3; alias vmh_key4 slot4; alias vmh_key5 slot5"
alias vmh_cycle4 "alias vmh_after3 vmh_go4; alias vmh_after4 vmh_go1; alias vmh_before4 vmh_go3; alias vmh_before1 vmh_go4; alias vmh_key4 vmh_go4; alias vmh_key5 slot5"
alias vmh_cycle5 "alias vmh_after3 vmh_go4; alias vmh_after4 vmh_go5; alias vmh_after5 vmh_go1; alias vmh_before4 vmh_go3; alias vmh_before5 vmh_go4; alias vmh_before1 vmh_go5; alias vmh_key4 vmh_go4; alias vmh_key5 vmh_go5"

// Banner/Concheror/Battalion's: firing it auto-switches back to the primary, so hide straight away.
// If rage wasn't full the banner stays out but hidden - any switch key puts it right.
alias vmh_banner "r_drawviewmodel 0; vmh_state1; alias vmh_lastgo vmh_go2"
alias vmh_armbanner "alias vmh_atk vmh_banner"
alias vmh_banner_on "alias vmh_on2 vmh_armbanner"
alias vmh_banner_off "alias vmh_on2 vmh_nop"

alias +vmh_attack "+attack; vmh_atk"
alias -vmh_attack "-attack"

// Spawn: primary is out, no last weapon yet. Defaults for classes without their own setup.
alias vmh_spawn "r_drawviewmodel 0; vmh_state1; alias vmh_lastgo vmh_go2"
vmh_cycle3
vmh_banner_off
vmh_spawn

bind "1" "vmh_go1"
bind "2" "vmh_go2"
bind "3" "vmh_go3"
bind "4" "vmh_key4"
bind "5" "vmh_key5"
bind "MWHEELUP" "vmh_prev"
bind "MWHEELDOWN" "vmh_next"
bind "q" "vmh_lastgo"
bind "MOUSE1" "+vmh_attack"
