// Damage-number batching for this class (aliases in overrides/autoexec.cfg)
dmgbatch_shots

// Primary viewmodel hiding (overrides/hide_primary.cfg): wheel order, banner hook, reset on spawn
vmh_cycle4
vmh_banner_off
vmh_spawn

// Mouse 4/5 reset to defaults (alias in overrides/autoexec.cfg)
classbinds_default
bind MOUSE4 "lastdisguise"         // redisguise as the last disguise
bind MOUSE5 "disguise 8 -2"         // friendly-spy disguise = instant undisguise (replaces push-to-talk on spy)
