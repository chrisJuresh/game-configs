// Knife Quickswitch (Hold for Knife, Release for Primary/Pistol)
unbind "mouse4"
alias "+knife" "slot3"
alias "-knife" "slot2; slot1"
bind "mouse4" "+knife"

// Scroll Wheel Jump (Bhopping)
bind "mwheeldown" "+jump"
bind "mwheelup" "+jump"
bind "space" "+jump" // Keeps spacebar working for normal jumps!

// This line MUST be at the very bottom of your autoexec file
host_writeconfig